paths:
  /api/bookings:
    post:
      summary: Create new booking
      tags: [Booking]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kostId
                - startDate
                - duration
              properties:
                kostId:
                  type: string
                  description: ID kost yang akan disewa
                startDate:
                  type: string
                  format: date
                  description: Tanggal mulai sewa (YYYY-MM-DD)
                duration:
                  type: number
                  minimum: 1
                  maximum: 12
                  description: Durasi sewa dalam bulan
                notes:
                  type: string
                  maxLength: 500
                  description: Catatan tambahan (opsional)
      responses:
        201:
          description: Booking berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Booking berhasil dibuat
                  data:
                    $ref: '#/components/schemas/Booking'
        400:
          description: Data tidak valid atau kost tidak tersedia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Token tidak valid

    get:
      summary: Get user's bookings
      tags: [Booking]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, active, completed, cancelled]
          description: Filter by booking status
        - in: query
          name: paymentStatus
          schema:
            type: string
            enum: [unpaid, paid, verified]
          description: Filter by payment status
      responses:
        200:
          description: Data booking berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data booking berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
        401:
          description: Token tidak valid

  /api/bookings/{id}:
    get:
      summary: Get booking by ID
      tags: [Booking]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Booking ID
      responses:
        200:
          description: Data booking berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data booking berhasil diambil
                  data:
                    $ref: '#/components/schemas/Booking'
        401:
          description: Token tidak valid
        404:
          description: Booking tidak ditemukan

  /api/bookings/{id}/cancel:
    put:
      summary: Cancel booking
      tags: [Booking]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Booking ID
      responses:
        200:
          description: Booking berhasil dibatalkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Booking berhasil dibatalkan
                  data:
                    $ref: '#/components/schemas/Booking'
        400:
          description: Booking tidak dapat dibatalkan
        401:
          description: Token tidak valid
        404:
          description: Booking tidak ditemukan

  /api/bookings/payments/{bookingId}/proof:
    post:
      summary: Upload payment proof
      tags: [Booking]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
          description: Booking ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - paymentProof
              properties:
                paymentProof:
                  type: string
                  format: binary
                  description: Bukti pembayaran (image)
      responses:
        200:
          description: Bukti pembayaran berhasil diupload
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bukti pembayaran berhasil diupload
                  data:
                    $ref: '#/components/schemas/Booking'
        400:
          description: Data tidak valid
        401:
          description: Token tidak valid
        404:
          description: Booking tidak ditemukan

  /api/bookings/statistics:
    get:
      summary: Get booking statistics (admin only)
      tags: [Booking]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Statistik booking berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Statistik booking berhasil diambil
                  data:
                    type: object
                    properties:
                      totalBookings:
                        type: number
                        description: Total booking
                      pendingBookings:
                        type: number
                        description: Booking pending
                      activeBookings:
                        type: number
                        description: Booking aktif
                      completedBookings:
                        type: number
                        description: Booking selesai
                      cancelledBookings:
                        type: number
                        description: Booking dibatalkan
                      totalRevenue:
                        type: number
                        description: Total pendapatan
        401:
          description: Token tidak valid atau tidak memiliki akses admin
