paths:
  /api/user/profile:
    get:
      summary: Get user profile
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Data profil berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data profil berhasil diambil
                  data:
                    $ref: '#/components/schemas/User'
        401:
          description: Token tidak valid

    put:
      summary: Update user profile
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                phone:
                  type: string
                address:
                  type: object
                  properties:
                    street: { type: string }
                    city: { type: string }
                    state: { type: string }
                    zipCode: { type: string }
      responses:
        200:
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Profil berhasil diperbarui
                  data:
                    $ref: '#/components/schemas/User'
        400:
          description: Data tidak valid
        401:
          description: Token tidak valid

  /api/user/profile/password:
    put:
      summary: Change password
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        200:
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password berhasil diubah
        400:
          description: Data tidak valid atau password saat ini salah
        401:
          description: Token tidak valid

  /api/user/bookings:
    get:
      summary: Get user bookings
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
          description: Filter by booking status
      responses:
        200:
          description: Data booking berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data booking berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
        401:
          description: Token tidak valid

  /api/user/bookings/active:
    get:
      summary: Get active booking
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Data booking aktif berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data booking aktif berhasil diambil
                  data:
                    $ref: '#/components/schemas/Booking'
        401:
          description: Token tidak valid

  /api/user/kost:
    get:
      summary: Get available kosts for user
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Data kost tersedia berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data kost tersedia berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Kost'
        401:
          description: Token tidak valid

  /api/user/kost/{roomType}:
    get:
      summary: Get available kosts by room type
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: roomType
          required: true
          schema:
            type: string
            enum: [A, B]
          description: Tipe kamar
      responses:
        200:
          description: Data kost tipe tertentu berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data kost tipe A berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Kost'
        400:
          description: Tipe kamar tidak valid
        401:
          description: Token tidak valid

  /api/user/{userId}:
    get:
      summary: Get user by ID (owner or admin only)
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: User ID
      responses:
        200:
          description: Data user berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data user berhasil diambil
                  data:
                    $ref: '#/components/schemas/User'
        401:
          description: Token tidak valid
        403:
          description: Akses ditolak
        404:
          description: User tidak ditemukan
