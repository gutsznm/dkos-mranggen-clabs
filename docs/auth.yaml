paths:
  /api/auth/register:
    post:
      summary: Register user baru
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: Nama lengkap user
                email:
                  type: string
                  format: email
                  description: Email user (harus unik)
                password:
                  type: string
                  minLength: 6
                  description: Password minimal 6 karakter
                phone:
                  type: string
                  description: Nomor telepon (opsional)
                adminSecretKey:
                  type: string
                  description: Secret key untuk registrasi admin (opsional)
      responses:
        201:
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Registrasi berhasil
                  token:
                    type: string
                    description: JWT token
                  user:
                    $ref: '#/components/schemas/User'
        400:
          description: Data tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email sudah terdaftar

  /api/auth/login:
    post:
      summary: Login user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: Email user
                password:
                  type: string
                  description: Password user
      responses:
        200:
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login berhasil
                  token:
                    type: string
                    description: JWT token
                  user:
                    $ref: '#/components/schemas/User'
        400:
          description: Data tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Email atau password salah
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email atau password salah

  /api/auth/me:
    get:
      summary: Get current user info
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Data user berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        401:
          description: Token tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Token tidak valid
