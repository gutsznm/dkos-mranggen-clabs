paths:
  /api/admin/users:
    get:
      summary: Get all users (admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [user, admin]
          description: Filter by user role
        - in: query
          name: isActive
          schema:
            type: boolean
          description: Filter by active status
        - in: query
          name: search
          schema:
            type: string
          description: Search by name or email
      responses:
        200:
          description: Data users berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data users berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        401:
          description: Token tidak valid atau tidak memiliki akses admin

  /api/admin/users/{userId}:
    get:
      summary: Get user by ID (admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: User ID
      responses:
        200:
          description: Data user berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data user berhasil diambil
                  data:
                    $ref: '#/components/schemas/User'
        401:
          description: Token tidak valid atau tidak memiliki akses admin
        404:
          description: User tidak ditemukan

    put:
      summary: Update user (admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [user, admin]
                isActive:
                  type: boolean
                phone:
                  type: string
                address:
                  type: object
                  properties:
                    street: { type: string }
                    city: { type: string }
                    state: { type: string }
                    zipCode: { type: string }
      responses:
        200:
          description: User berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User berhasil diperbarui
                  data:
                    $ref: '#/components/schemas/User'
        400:
          description: Data tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Token tidak valid atau tidak memiliki akses admin
        404:
          description: User tidak ditemukan

  /api/admin/kosts:
    get:
      summary: Get all kosts (admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: roomType
          schema:
            type: string
            enum: [A, B]
          description: Filter by room type
        - in: query
          name: status
          schema:
            type: string
            enum: [available, full, maintenance]
          description: Filter by status
      responses:
        200:
          description: Data kosts berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data kosts berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Kost'
        401:
          description: Token tidak valid atau tidak memiliki akses admin

  /api/admin/bookings:
    get:
      summary: Get all bookings (admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, active, completed, cancelled]
          description: Filter by booking status
        - in: query
          name: paymentStatus
          schema:
            type: string
            enum: [unpaid, paid, verified]
          description: Filter by payment status
      responses:
        200:
          description: Data bookings berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data bookings berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
        401:
          description: Token tidak valid atau tidak memiliki akses admin

  /api/admin/bookings/{bookingId}/approve:
    put:
      summary: Approve booking (admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
          description: Booking ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adminNotes:
                  type: string
                  maxLength: 500
                  description: Catatan admin (opsional)
      responses:
        200:
          description: Booking berhasil disetujui
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Booking berhasil disetujui
                  data:
                    $ref: '#/components/schemas/Booking'
        400:
          description: Booking tidak dapat disetujui
        401:
          description: Token tidak valid atau tidak memiliki akses admin
        404:
          description: Booking tidak ditemukan

  /api/admin/bookings/{bookingId}/reject:
    put:
      summary: Reject booking (admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
          description: Booking ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - adminNotes
              properties:
                adminNotes:
                  type: string
                  maxLength: 500
                  description: Alasan penolakan
      responses:
        200:
          description: Booking berhasil ditolak
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Booking berhasil ditolak
                  data:
                    $ref: '#/components/schemas/Booking'
        400:
          description: Booking tidak dapat ditolak
        401:
          description: Token tidak valid atau tidak memiliki akses admin
        404:
          description: Booking tidak ditemukan

  /api/admin/gallery:
    get:
      summary: Get gallery items (admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: kostId
          schema:
            type: string
          description: Filter by kost ID
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [image, video]
          description: Filter by media type
        - in: query
          name: isActive
          schema:
            type: boolean
          description: Filter by active status
      responses:
        200:
          description: Data gallery berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gallery'
        401:
          description: Token tidak valid atau tidak memiliki akses admin

  /api/admin/dashboard:
    get:
      summary: Get dashboard statistics (admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Statistik dashboard berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Statistik dashboard berhasil diambil
                  data:
                    type: object
                    properties:
                      totalUsers:
                        type: number
                        description: Total users
                      totalKosts:
                        type: number
                        description: Total kosts
                      totalBookings:
                        type: number
                        description: Total bookings
                      pendingBookings:
                        type: number
                        description: Booking pending
                      totalRevenue:
                        type: number
                        description: Total pendapatan
                      availableRooms:
                        type: number
                        description: Total kamar tersedia
        401:
          description: Token tidak valid atau tidak memiliki akses admin
